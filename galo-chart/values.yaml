    replicaCount: 1
    service:
      name: svc-supplier
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/auth-url: "{{ printf \"http://%s.%s.svc.cluster.local:%d/auth/verify\" .Values.services.authservice.service.name .Release.Namespace (int (.Values.services.authservice.service.port | default .Values.global.service.port)) }}"
        nginx.ingress.kubernetes.io/auth-response-headers: "X-User, X-User-Role"
        nginx.ingress.kubernetes.io/auth-request-set-header: |
          X-Original-Method $request_method
      hosts:
        - host: arch.homework
          paths:
            - path: /mappings
              pathType: Exact
              definition: POST Create mappings between system and supplier ingredient identifiers
            - path: /suppliers/orders
              pathType: Exact
              definition: GET Retrieve all supplier orders; POST Create a new supplier order
            - path: /suppliers/orders/([^/]+)
              pathType: ImplementationSpecific
              definition: GET Retrieve a specific supplier order by ID; PUT Update an existing supplier order
            - path: /suppliers/orders/([^/]+)/send
              pathType: ImplementationSpecific
              definition: POST Send a specific supplier order to the supplier
            - path: /suppliers
              pathType: Exact
              definition: GET Retrieve all suppliers; POST Create a new supplier
            - path: /suppliers/([^/]+)
              pathType: ImplementationSpecific
              definition: GET Retrieve a specific supplier by ID; PUT Update an existing supplier
            - path: /supplies
              pathType: Exact
              definition: GET Retrieve all supplies
            - path: /supplies/([^/]+)
              pathType: ImplementationSpecific
              definition: GET Retrieve a specific supply by ID
            - path: /supplies/([^/]+)/accept
              pathType: ImplementationSpecific
              definition: POST Accept a specific delivery order by ID

  supplyorderservice:
    enabled: true
    application:
      image:
        repository: sdenisenko/supply-order-service
        tag: "1.1"
      kafka:
        enabled: true
        groupId: supply-order-service-group
        topics:
          - supply-order-request
          - supply-order-response
          - supply-request
          - supply-response
      env:
        SCHEMA_REGISTRY_URL: http://schema-registry:8080/apis/registry/v2
    database:
      enabled: false
    replicaCount: 1
    service:
      name: svc-supply-order
    ingress:
      enabled: false

  userservice:
    enabled: true
    application:
      image:
        repository: sdenisenko/user-service
        tag: "1.1"
      redis:
        host: my-redis-master
        port: 6379
      kafka:
        enabled: false
      env:
        KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/erp-galo
        KEYCLOAK_AUTH_SERVICE_URL: http://keycloak:8080
        KEYCLOAK_REALM: erp-galo
        KEYCLOAK_SECRET: 9uNx6hi8kRf6hAVfbbMiWbgVJ7o8L7k1
        KEYCLOAK_CLIENT_ID: erp-app
    database:
      enabled: false
    replicaCount: 1
    service:
      name: svc-user
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/auth-url: "{{ printf \"http://%s.%s.svc.cluster.local:%d/auth/verify\" .Values.services.authservice.service.name .Release.Namespace (int (.Values.services.authservice.service.port | default .Values.global.service.port)) }}"
        nginx.ingress.kubernetes.io/auth-response-headers: "X-User, X-User-Role"
        nginx.ingress.kubernetes.io/auth-request-set-header: |
          X-Original-Method $request_method
      hosts:
        - host: arch.homework
          paths:
            - path: /roles
              pathType: Exact
              definition: GET Retrieve a list of all roles; POST Create a new user role
            - path: /roles/([^/]+)
              pathType: ImplementationSpecific
              definition: PUT Update an existing user role; DELETE Delete a user role by ID
            - path: /users
              pathType: Exact
              definition: GET Retrieve a list of all users; POST Create a new user with basic profile information
            - path: /users/([^/]+)
              pathType: ImplementationSpecific
              definition: PUT Update an existing user; DELETE Delete user by ID
            - path: /user-roles/([^/]+)/assign/([^/]+)
              pathType: ImplementationSpecific
              definition: POST Assign role to a specific user
            - path: /user-roles/([^/]+)/remove/([^/]+)
              pathType: ImplementationSpecific
              definition: DELETE Remove a role from a specific user

nameOverride: "galo"
