spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
  jpa:
    hibernate:
      ddl-auto: ${JPA_GENERATION}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 60000
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 2000ms
  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS}
    topics:
      supply-request: ${KAFKA_TOPIC_SUPPLY_REQUEST}
      supply-response: ${KAFKA_TOPIC_SUPPLY_RESPONSE}
      supply-received: ${KAFKA_TOPIC_SUPPLY_RECEIVED}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.apicurio.registry.serde.avro.AvroKafkaSerializer
      properties:
        apicurio.registry.url: ${SCHEMA_REGISTRY_URL}
        apicurio.registry.auto-register: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
      group-id: ${KAFKA_GROUP_ID}
      properties:
        apicurio.registry.url: ${SCHEMA_REGISTRY_URL}
        apicurio.registry.auto-register: true
        apicurio.registry.use-specific-avro-reader: true
        spring:
          json:
            trusted:
              packages: "*"
        auto-offset-reset: earliest

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true # /actuator/health/liveness
    readinessstate:
      enabled: true # /actuator/health/readiness
    db:
      enabled: true

scheduler:
  supplier-scheduler-cron: ${SUPPLIER_SCHEDULER_CRON}
  supplier-initial-delay: ${SUPPLIER_INITIAL_DELAY}
  supplier-fixed-rate: ${SUPPLIER_FIXED_RATE}